<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STACKS 3D Main Screen</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030711;
        --surface: rgba(3, 8, 17, 0.92);
        --line: rgba(125, 220, 255, 0.2);
        --cyan: #39d9ff;
        --blue: #3387ff;
        --violet: #8b5cf6;
        --green: #35f07d;
        --amber: #ffcc4d;
        --text: #f7fbff;
        --muted: #90a4bb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 1180px;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgba(42, 180, 255, 0.15), transparent 35%),
          radial-gradient(circle at 64% 30%, rgba(139, 92, 246, 0.12), transparent 26%),
          linear-gradient(180deg, #071526 0%, var(--bg) 58%, #010309 100%);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      .app {
        position: relative;
        display: grid;
        min-height: 100vh;
        grid-template-rows: 74px 1fr 118px;
        padding: 16px 20px 18px;
      }

      .topbar,
      .bottom-playbar,
      .settings-drawer {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(2, 8, 18, 0.86);
        box-shadow: 0 22px 72px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(18px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
      }

      .brand,
      .wallet {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 8px;
        background: rgba(57, 217, 255, 0.1);
        box-shadow: 0 0 28px rgba(57, 217, 255, 0.28);
      }

      .brand-mark span {
        position: absolute;
        width: 15px;
        height: 15px;
        border: 1px solid rgba(229, 252, 255, 0.75);
        border-radius: 4px;
        background: linear-gradient(135deg, var(--cyan), var(--violet));
        box-shadow: 0 0 14px rgba(57, 217, 255, 0.6);
      }

      .brand-mark span:nth-child(1) {
        left: 7px;
        bottom: 8px;
      }

      .brand-mark span:nth-child(2) {
        left: 20px;
        bottom: 8px;
      }

      .brand-mark span:nth-child(3) {
        left: 14px;
        bottom: 21px;
      }

      .brand-title {
        font-size: 30px;
        font-weight: 950;
        letter-spacing: 0;
      }

      .balance {
        display: grid;
        min-width: 176px;
        height: 48px;
        align-content: center;
        border: 1px solid rgba(53, 240, 125, 0.22);
        border-radius: 8px;
        background: rgba(53, 240, 125, 0.08);
        padding: 0 16px;
        text-align: right;
      }

      .balance span {
        color: #98dfb6;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .balance strong {
        color: var(--green);
        font-size: 22px;
        line-height: 1;
      }

      .icon-button {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.045);
        color: #dff8ff;
        font-size: 22px;
      }

      .game {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }

      .stage {
        position: absolute;
        inset: 12px 0 0;
        overflow: hidden;
        border: 1px solid rgba(125, 220, 255, 0.13);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(6, 16, 30, 0.58), rgba(1, 4, 10, 0.12) 42%, rgba(1, 4, 10, 0.78)),
          radial-gradient(circle at 50% 55%, rgba(57, 217, 255, 0.16), transparent 30%);
      }

      #stack-scene {
        position: absolute;
        inset: 0;
        opacity: 0.9;
      }

      #stack-scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .arena-floor {
        position: absolute;
        left: 50%;
        bottom: 36px;
        width: 720px;
        height: 190px;
        transform: translateX(-50%) perspective(900px) rotateX(64deg);
        border: 1px solid rgba(57, 217, 255, 0.25);
        border-radius: 50%;
        background:
          radial-gradient(circle, rgba(57, 217, 255, 0.23), rgba(51, 135, 255, 0.09) 38%, transparent 70%),
          linear-gradient(90deg, transparent, rgba(57, 217, 255, 0.22), transparent);
        box-shadow: 0 0 70px rgba(57, 217, 255, 0.2);
      }

      .stack-art {
        position: absolute;
        left: 50%;
        top: 49%;
        width: 520px;
        height: 410px;
        transform: translate(-50%, -50%);
        transform-style: preserve-3d;
        pointer-events: none;
        filter: drop-shadow(0 32px 46px rgba(0, 0, 0, 0.42));
      }

      .cube {
        position: absolute;
        width: 96px;
        height: 96px;
        border: 1px solid rgba(229, 252, 255, 0.8);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.5), transparent 30%),
          linear-gradient(145deg, rgba(53, 226, 255, 0.95), rgba(46, 126, 255, 0.9) 52%, rgba(139, 92, 246, 0.94));
        box-shadow:
          inset 11px 10px 20px rgba(255, 255, 255, 0.24),
          inset -18px -18px 28px rgba(22, 5, 79, 0.34),
          0 0 34px rgba(57, 217, 255, 0.42);
        transform: rotateX(58deg) rotateZ(45deg);
        animation: cubePulse 2.6s ease-in-out infinite;
      }

      .cube.gold {
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.54), transparent 30%),
          linear-gradient(145deg, #fff09c, #ffc246 54%, #a855f7);
        box-shadow:
          inset 11px 10px 20px rgba(255, 255, 255, 0.24),
          inset -18px -18px 28px rgba(116, 59, 0, 0.32),
          0 0 46px rgba(255, 204, 77, 0.5);
      }

      .cube:nth-child(2n) {
        animation-delay: -0.45s;
      }

      .cube:nth-child(3n) {
        animation-delay: -0.9s;
      }

      @keyframes cubePulse {
        0%,
        100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -8px;
        }
      }

      .hud {
        position: absolute;
        top: 26px;
        left: 26px;
        display: grid;
        gap: 8px;
      }

      .hud .label {
        color: var(--cyan);
        font-size: 12px;
        font-weight: 950;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .hud .multiplier {
        font-size: 78px;
        font-weight: 950;
        line-height: 0.95;
        text-shadow: 0 0 34px rgba(57, 217, 255, 0.42);
      }

      .stage-status {
        position: absolute;
        right: 26px;
        top: 28px;
        min-width: 174px;
        border: 1px solid rgba(53, 240, 125, 0.25);
        border-radius: 8px;
        background: rgba(53, 240, 125, 0.08);
        padding: 14px 16px;
        text-align: right;
      }

      .stage-status span {
        color: #9ceabf;
        font-size: 11px;
        font-weight: 950;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .stage-status strong {
        display: block;
        margin-top: 6px;
        color: var(--green);
        font-size: 32px;
        line-height: 1;
      }

      .bottom-playbar {
        align-self: end;
        display: grid;
        grid-template-columns: 210px 210px 160px 1fr 64px;
        gap: 12px;
        align-items: center;
        min-height: 94px;
        padding: 14px;
      }

      .control {
        display: grid;
        gap: 7px;
      }

      .control label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 950;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .stepper {
        display: grid;
        grid-template-columns: 42px 1fr 42px;
        gap: 8px;
      }

      .stepper button,
      .value,
      .toggle-pill {
        height: 46px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
      }

      .stepper button {
        font-size: 22px;
        font-weight: 950;
      }

      .value {
        display: grid;
        place-items: center;
        font-size: 20px;
        font-weight: 950;
      }

      .toggle-pill {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 13px;
        color: #d8e7f5;
        font-size: 14px;
        font-weight: 900;
      }

      .toggle-pill::after {
        width: 37px;
        height: 22px;
        border-radius: 99px;
        background:
          radial-gradient(circle at 73% 50%, #fff 0 7px, transparent 8px),
          var(--green);
        content: "";
      }

      .play-button {
        height: 64px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(135deg, #20ed76, #5effae);
        color: #021109;
        font-size: 26px;
        font-weight: 950;
        box-shadow: 0 0 36px rgba(53, 240, 125, 0.28);
      }

      .settings-drawer {
        position: absolute;
        right: 20px;
        bottom: 132px;
        width: 318px;
        padding: 16px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .settings-drawer.open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .drawer-head h2 {
        margin: 0;
        font-size: 18px;
      }

      .drawer-list {
        display: grid;
        gap: 10px;
      }

      .drawer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.045);
        padding: 0 12px;
        color: #d8e7f5;
        font-size: 14px;
        font-weight: 850;
      }

      .switch {
        width: 42px;
        height: 23px;
        border-radius: 99px;
        background:
          radial-gradient(circle at 72% 50%, #fff 0 7px, transparent 8px),
          var(--green);
      }

      .switch.off {
        background:
          radial-gradient(circle at 28% 50%, #fff 0 7px, transparent 8px),
          #293448;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="brand-title">STACKS</div>
        </div>
        <div class="wallet">
          <div class="balance"><span>Demo Balance</span><strong>12,450.00</strong></div>
          <button class="icon-button" id="topSettings" aria-label="Open settings">⚙</button>
        </div>
      </header>

      <section class="game" aria-label="STACKS game arena">
        <div class="stage">
          <div id="stack-scene"></div>
          <div class="arena-floor" aria-hidden="true"></div>
          <div class="stack-art" aria-hidden="true">
            <span class="cube" style="left: 26px; top: 272px"></span>
            <span class="cube" style="left: 112px; top: 272px"></span>
            <span class="cube" style="left: 198px; top: 272px"></span>
            <span class="cube" style="left: 284px; top: 272px"></span>
            <span class="cube" style="left: 370px; top: 272px"></span>
            <span class="cube" style="left: 69px; top: 198px"></span>
            <span class="cube" style="left: 155px; top: 198px"></span>
            <span class="cube" style="left: 241px; top: 198px"></span>
            <span class="cube" style="left: 327px; top: 198px"></span>
            <span class="cube" style="left: 112px; top: 124px"></span>
            <span class="cube" style="left: 198px; top: 124px"></span>
            <span class="cube" style="left: 284px; top: 124px"></span>
            <span class="cube" style="left: 155px; top: 50px"></span>
            <span class="cube" style="left: 241px; top: 50px"></span>
            <span class="cube gold" style="left: 198px; top: -24px"></span>
          </div>
          <div class="hud">
            <div class="label">Current Multiplier</div>
            <div class="multiplier">3.42x</div>
          </div>
          <div class="stage-status">
            <span>Current Win</span>
            <strong>342.00</strong>
          </div>
        </div>
      </section>

      <section class="bottom-playbar" aria-label="Play controls">
        <div class="control">
          <label>Bet Amount</label>
          <div class="stepper"><button aria-label="Decrease bet">-</button><div class="value">100</div><button aria-label="Increase bet">+</button></div>
        </div>
        <div class="control">
          <label for="target">Predict Multiplier</label>
          <div class="stepper"></div>
        </div>
        <div class="control">
          <label>Autoplay</label>
          <button class="toggle-pill" aria-label="Toggle autoplay">On</button>
        </div>
        <button class="play-button">Start Stack</button>
        <button class="icon-button" id="barSettings" aria-label="Open settings">⚙</button>
      </section>

      <aside class="settings-drawer" id="settingsDrawer" aria-label="Settings panel">
        <div class="drawer-head">
          <h2>Settings</h2>
          <button class="icon-button" id="closeSettings" aria-label="Close settings">×</button>
        </div>
        <div class="drawer-list">
          <div class="drawer-row"><span>Sound</span><span class="switch"></span></div>
          <div class="drawer-row"><span>Music</span><span class="switch"></span></div>
          <div class="drawer-row"><span>Turbo Mode</span><span class="switch off"></span></div>
          <div class="drawer-row"><span>Animations</span><span class="switch"></span></div>
          <div class="drawer-row"><span>Fairness Details</span><span>View</span></div>
          <div class="drawer-row"><span>Session Limit</span><span>30 min</span></div>
        </div>
      </aside>
    </main>

    <script type="module" src="./main.js"></script>
    <link rel="stylesheet" href="./game.css" />
    <script>
      const drawer = document.querySelector('#settingsDrawer');
      const toggleDrawer = () => drawer.classList.toggle('open');
      document.querySelector('#topSettings').addEventListener('click', toggleDrawer);
      document.querySelector('#barSettings').addEventListener('click', toggleDrawer);
      document.querySelector('#closeSettings').addEventListener('click', () => drawer.classList.remove('open'));
    </script>
  </body>
</html>
